name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Vercel performs the full Next.js production build with the real Clerk
      # environment. CI independently proves that all bot/server TypeScript is valid
      # without copying production authentication secrets into GitHub Actions.
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
