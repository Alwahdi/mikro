name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Vercel currently resolves package.json with npm install because the
      # historical lock file predates the Next.js/AI dependency upgrades.
      # Keep CI equivalent to production; we can regenerate/commit the lock
      # separately without blocking code validation.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
